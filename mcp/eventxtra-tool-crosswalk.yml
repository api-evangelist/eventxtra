coverage:
  mcp_areas_documented: 4
  mcp_tools_named_by_vendor: 0
  areas_bound_to_rest: 3
  areas_with_no_rest_backing: 1
  rest_operations_total: 58
  rest_operations_reachable_via_an_mcp_area: 9
  rest_operations_with_no_mcp_area: 49
  reading: >-
    The MCP server is READ-ONLY over four analytics areas; the REST API is the
    entire write surface. They are non-overlapping products, not two projections
    of the same capability set — an agent that only speaks MCP to EventX can
    answer questions but cannot create an event, register an attendee, or send a
    confirmation.
