  label: Public documentation, gated credentials
  confidence: high
  note: >-
    The OpenAPI and the full API reference are anonymously readable, and the
    platform itself has a free self-service tier. The apiToken that POST
    /public-api/v1/auth requires is listed on the pricing page as an
    Enterprise-plan-only entitlement, so no self-service developer can obtain API
    credentials.
