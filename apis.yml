aid: eventxtra
name: EventX
description: >-
  EventX (EventXtra Limited) is an AI-powered, all-in-one event management and
  marketing platform for in-person, virtual, and hybrid events, headquartered in
  Hong Kong with offices across APAC. It provides event registration and RSVP,
  QR-code check-in and badge printing, ticketing and payment with 0% platform
  fees, AI Lead Finder, event website building, virtual event hosting, sponsor
  and exhibitor management, lead capture, and WhatsApp/email marketing. EventX
  serves 5,600+ brands and is ISO 27001 certified and GDPR compliant. It also
  offers an official hosted MCP server that lets AI assistants query live event
  data (registrations, sessions, ticket sales, attendance) in natural language,
  provisioned one-click from the EventX dashboard and compatible with Claude,
  ChatGPT, Cursor, and OpenCode. Added to the API Evangelist network as a
  portfolio company of 500 Global and enriched via the pipeline.
