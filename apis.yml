apis:
- name: EventX Public API
  description: >-
    The EventX Public API is a REST interface over the EventX event management
    platform, published as an OpenAPI 3.2.0 document with 46 paths and 58
    operations across Auth, Event, Attendee, Custom Field, Event Webhook, Order,
    Outreach, Ticket Class, Invoice, Media, Registration Form, Registration
    Service, Registration Order, Salesforce and organization-scoped custom
    domains. Authentication is an apiToken-for-JWT exchange (POST
    /public-api/v1/auth) with the resulting bearer token sent in an Authorization
    header. Listing operations share a page/pageSize envelope with a
    { dataList, pagination } response, and a per-event webhook subscription API
    delivers five attendee lifecycle actions. The specification and the reference
    documentation are anonymously readable; the apiToken itself is an
    Enterprise-plan entitlement.
  humanURL: https://eventx-hq.gitbook.io/knowledge-base/api-doc/auth
  baseURL: https://esaas-api.eventx.io
